# pnpm 10+ fails installs when dependency build scripts are ignored.
# Release installs already pass --ignore-scripts; keep local installs consistent
# without an interactive `pnpm approve-builds` step.
strictDepBuilds: false

overrides:
  undici: ">=8.12.2"
  minimatch: ">=11.0.1"

allowBuilds:
  '@google/genai': set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
